services:
  - type: web
    name: zmb-dos-cortes
    runtime: python
    plan: free
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATA_DIR
        value: /tmp/zmb-agenda-data
      - key: WHATSAPP_RECIPIENT
        value: "5583988354958"
