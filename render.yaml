services:
  - type: web
    name: zmb-dos-cortes
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATA_DIR
        value: /tmp/zmb-agenda-data
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_RECIPIENT
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
